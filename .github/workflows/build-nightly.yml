# This workflow will build the extension against the latest Liquibase artifact
name: "Nightly build"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: read
  pull-requests: write
  packages: read
  id-token: write # Required for OIDC authentication

jobs:
  nightly-build:
    uses: liquibase/build-logic/.github/workflows/os-extension-test.yml@main
    with:
      nightly: true
    secrets: inherit

  mongo-atlas-tests:
    name: MongoDB Atlas 8 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the harness DB admin credentials from vault
        uses: liquibase/build-logic/.github/actions/setup-aws-vault@6e9cd7ae7956e31d3381e247f25de68f306ba80c # main
        with:
          group: th-db-shared-admin
          role-arn: ${{ secrets.VAULT_GROUPED_TH_DB_SHARED_ADMIN_ROLE_ARN }}

      - name: Get the Mongo Atlas URL from vault
        uses: liquibase/build-logic/.github/actions/setup-aws-vault@6e9cd7ae7956e31d3381e247f25de68f306ba80c # main
        with:
          group: th-endpoint-mongo-atlas-shared
          role-arn: ${{ secrets.VAULT_GROUPED_TH_ENDPOINT_MONGO_ATLAS_SHARED_ROLE_ARN }}

      - name: Harness Foundational Test Suite Run on Atlas 8
        run: mvn -Dtest="HarnessNoSqlCompatibility" -DconfigFile=/harness-config-cloud.yml  -DdbName=mongodb -DdbUsername=${{env.TH_DB_ADMIN}} -DdbPassword=${{env.TH_DB_PASSWD}} -DdbUrl='${{env.TH_MONGO_ATLAS_URL}}' clean package

      - name: Archive Mongo Atlas Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mongodb-test-results
          path: build/spock-reports
